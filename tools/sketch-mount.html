<!--
  師父手繪的裱框版型：紙底 + 細框 + 左下二字箝羊馬剪影 + 右下鷹捷詠春印。
  用法（Edge 無頭模式渲染成 1600×2000，再轉 jpg）：
    1. 先把原圖裁掉多餘的邊：ffmpeg -i 原圖.jpg -vf "crop=W:H:X:Y" sketch-crop.jpg，放在本檔同一層
    2. 依裁後的長寬比調整 .ph 的 height（寬固定 1360）與 .band 的 top（= 96 + height）
    3. "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" --headless=new --disable-gpu --hide-scrollbars \
         --window-size=1600,2000 --screenshot="C:/.../out.png" "file:///C:/.../tools/sketch-mount.html"
    4. ffmpeg -i out.png -q:v 3 assets/img/新檔名.jpg，然後 npm run img
  題款文字只能用師父自己的標題／名字，跟站上文案規則一樣。
-->
<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}
body{width:1600px;height:2000px;background:#f3eee3;position:relative;overflow:hidden;font-family:'Noto Serif TC',serif;color:#100e0c}
.grain{position:absolute;inset:0;opacity:.55;mix-blend-mode:multiply}
.vig{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 40%,rgba(255,255,255,.35),rgba(120,100,70,.14))}
.ph{position:absolute;left:120px;top:96px;width:1360px;height:1721px;box-shadow:0 18px 50px rgba(40,30,20,.22),0 2px 6px rgba(40,30,20,.18)}
.ph img{display:block;width:100%;height:100%;object-fit:cover;filter:brightness(1.05) contrast(1.04) saturate(.88)}
.ph::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(16,14,12,.18)}
.band{position:absolute;left:120px;right:120px;top:1817px;bottom:0;display:flex;align-items:center;gap:36px}
.stance{width:92px;height:147px;flex:none;opacity:.9}
.rule{flex:1;height:1px;background:rgba(16,14,12,.22)}
.cap{font-size:40px;letter-spacing:.26em;color:#2e2a25;white-space:nowrap}
.cap small{font-size:27px;letter-spacing:.24em;color:#6c665c;margin-left:26px}
.seal{width:122px;height:122px;flex:none}
</style></head><body>
<div class="vig"></div>
<svg class="grain" xmlns="http://www.w3.org/2000/svg" width="1600" height="2000"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .55 0 0 0 0 .5 0 0 0 0 .42 0 0 0 .18 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="ph"><img src="sketch-crop.jpg"><!-- 裁好的原圖，不進 git --></div>
<div class="band">
  <svg class="stance" viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg">
    <g fill="#100e0c">
      <circle cx="50" cy="15" r="11"/><rect x="45.5" y="24" width="9" height="8"/>
      <path d="M27 36 Q50 28 73 36 L69 86 Q50 92 31 86 Z"/>
    </g>
    <g fill="none" stroke="#100e0c" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 42 L20 60 L31 64" stroke-width="9"/><path d="M70 42 L80 60 L69 64" stroke-width="9"/>
      <path d="M38 86 L43 114" stroke-width="11"/><path d="M62 86 L57 114" stroke-width="11"/>
      <path d="M43 114 L34 144" stroke-width="10"/><path d="M57 114 L66 144" stroke-width="10"/>
    </g>
    <g fill="#100e0c">
      <circle cx="32" cy="64" r="6.5"/><circle cx="68" cy="64" r="6.5"/>
      <circle cx="43" cy="114" r="6"/><circle cx="57" cy="114" r="6"/>
      <path d="M26 142 L46 133 L49 141 L33 151 Z"/><path d="M74 142 L54 133 L51 141 L67 151 Z"/>
    </g>
  </svg>
  <span class="cap">詠春打鬥的四個階段<small>黃英哲　手繪</small></span>
  <span class="rule"></span>
  <svg class="seal" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <rect x="1.5" y="1.5" width="45" height="45" rx="3" fill="#a3392a"/>
    <text font-family="'Noto Serif TC',serif" font-weight="700" font-size="19" fill="#f5f2ea" text-anchor="middle">
      <tspan x="35" y="21.5">鷹</tspan><tspan x="35" y="41">捷</tspan><tspan x="14" y="21.5">詠</tspan><tspan x="14" y="41">春</tspan>
    </text>
  </svg>
</div>
</body></html>
